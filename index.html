<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>動画用アイコンメーカー</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --border-color: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 56px;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    #drop-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .drop-zone {
      width: 100%;
      max-width: 520px;
      height: 320px;
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      background-color: rgba(30, 41, 59, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background-color: rgba(59, 130, 246, 0.1);
    }

    .drop-zone p {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .drop-zone span {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    #editor-screen {
      display: none;
      flex: 1;
      height: calc(100vh - 56px);
    }

    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: 
        linear-gradient(45deg, #1e293b 25%, transparent 25%), 
        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
      position: relative;
      padding: 24px;
    }

    canvas {
      max-width: 100%;
      max-height: 75vh;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .canvas-hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-sub);
      background: rgba(15, 23, 42, 0.8);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .sidebar {
      width: 410px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .control-group {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-group h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85rem;
    }

    .row label {
      color: var(--text-main);
      white-space: nowrap;
      flex: 1;
    }

    .control-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1.5;
    }

    select, input[type="number"], input[type="text"] {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .num-input-1to10 {
      width: 50px;
      text-align: center;
      font-weight: 600;
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
    }

    .hex-input {
      width: 85px;
      font-family: monospace;
    }

    .angle-dial-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .angle-dial {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--panel-bg);
      border: 2px solid var(--accent);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .angle-dial::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background-color: var(--text-sub);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .angle-knob {
      width: 14px;
      height: 14px;
      background-color: #ef4444;
      border: 2px solid #fff;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
      font-size: 0.9rem;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>ICON MAKER STUDIO</h1>
    <button id="reset-btn" class="btn btn-secondary hidden" style="padding: 6px 12px; font-size: 0.8rem;">別の画像を読み込む</button>
  </header>

  <div id="drop-screen">
    <div class="drop-zone" id="drop-zone">
      <p>PNG画像をここにドラッグ＆ドロップ</p>
      <span>またはクリックしてファイルを選択（背景透過PNG推奨）</span>
      <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" class="hidden" />
    </div>
  </div>

  <div id="editor-screen">
    <div class="canvas-area">
      <canvas id="preview-canvas" width="800" height="800"></canvas>
      <div class="canvas-hint">キャンバス上をドラッグで位置移動 ／ ホイールで拡大縮小</div>
    </div>

    <div class="sidebar">
      <!-- 1. フレーム形状 -->
      <div class="control-group">
        <h2>1. フレーム形状・比率</h2>
        <div class="row">
          <label>基準の形</label>
          <select id="shape-type" style="flex: 1.5;">
            <option value="circle">円 / 楕円</option>
            <option value="rect">四角 / 長方形</option>
            <option value="roundRect">角丸四角（カプセル可変）</option>
            <option value="polygon">多角形（N角形）</option>
            <option value="star">星形</option>
            <option value="heart">ハート</option>
            <option value="sfHud">SF・サイバーHUD</option>
          </select>
        </div>

        <div class="row hidden" id="polygon-sides-row">
          <label>角の数</label>
          <div class="control-inputs">
            <input type="range" id="polygon-sides" min="3" max="12" value="6" />
            <input type="number" id="polygon-sides-num" class="num-input-1to10" min="1" max="10" value="6" />
          </div>
        </div>

        <div class="row hidden" id="corner-radius-row">
          <label>角の丸み</label>
          <div class="control-inputs">
            <input type="range" id="corner-radius" min="0" max="200" value="40" />
            <input type="number" id="corner-radius-num" class="num-input-1to10" min="1" max="10" value="3" />
          </div>
        </div>

        <div class="row">
          <label>横幅比率</label>
          <div class="control-inputs">
            <input type="range" id="aspect-x" min="0.5" max="1.4" step="0.02" value="1" />
            <input type="number" id="aspect-x-num" class="num-input-1to10" min="1" max="10" value="5" />
          </div>
        </div>
        <div class="row">
          <label>縦幅比率</label>
          <div class="control-inputs">
            <input type="range" id="aspect-y" min="0.5" max="1.4" step="0.02" value="1" />
            <input type="number" id="aspect-y-num" class="num-input-1to10" min="1" max="10" value="5" />
          </div>
        </div>
      </div>

      <!-- 2. はみ出し演出 -->
      <div class="control-group">
        <h2>2. はみ出し演出（飛び出し方向）</h2>
        <div class="row">
          <label>はみ出しを有効化</label>
          <input type="checkbox" id="popout-enable" checked style="width: 18px; height: 18px;" />
        </div>
        <div class="angle-dial-container" id="popout-controls">
          <div class="angle-dial" id="angle-dial" title="ドラッグして飛び出す方向を指定">
            <div class="angle-knob" id="angle-knob"></div>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
            <span style="font-size: 0.8rem; color: var(--text-sub);">赤い点を回して飛び出させる方向を指定します。</span>
            <div class="row" style="margin-bottom: 0;">
              <label style="font-size: 0.75rem;">広さ</label>
              <div class="control-inputs">
                <input type="range" id="popout-spread" min="30" max="180" value="110" />
                <input type="number" id="popout-spread-num" class="num-input-1to10" min="1" max="10" value="6" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. フレーム枠・背景 -->
      <div class="control-group">
        <h2>3. フレーム枠・背景デザイン</h2>
        <div class="row">
          <label>枠線の太さ</label>
          <div class="control-inputs">
            <input type="range" id="border-width" min="0" max="40" value="12" />
            <input type="number" id="border-width-num" class="num-input-1to10" min="1" max="10" value="4" />
          </div>
        </div>
        <div class="row">
          <label>枠線の色</label>
          <div class="color-picker-wrap">
            <input type="color" id="border-color" value="#38bdf8" />
            <input type="text" id="border-hex" class="hex-input" value="#38BDF8" />
          </div>
        </div>
        <div class="row">
          <label>背景プリセット</label>
          <select id="bg-preset" style="flex: 1.5;">
            <option value="solid">単色塗りつぶし</option>
            <option value="transparent">透明（透過）</option>
            <option value="gradient">グラデーション</option>
            <option value="sunburst">集中線風エフェクト</option>
          </select>
        </div>
        <div class="row" id="bg-color1-row">
          <label>背景カラー1</label>
          <div class="color-picker-wrap">
            <input type="color" id="bg-color1" value="#0f172a" />
            <input type="text" id="bg-hex1" class="hex-input" value="#0F172A" />
          </div>
        </div>
        <div class="row hidden" id="bg-color2-row">
          <label>背景カラー2</label>
          <div class="color-picker-wrap">
            <input type="color" id="bg-color2" value="#1e3a8a" />
            <input type="text" id="bg-hex2" class="hex-input" value="#1E3A8A" />
          </div>
        </div>
      </div>

      <!-- 4. キャラクター調整 -->
      <div class="control-group">
        <h2>4. キャラクター位置・サイズ</h2>
        <div class="row">
          <label>横位置</label>
          <div class="control-inputs">
            <input type="range" id="img-pos-x" min="0" max="800" value="400" />
            <input type="number" id="img-pos-x-num" class="num-input-1to10" min="1" max="10" value="5" />
          </div>
        </div>
        <div class="row">
          <label>縦位置</label>
          <div class="control-inputs">
            <input type="range" id="img-pos-y" min="0" max="800" value="420" />
            <input type="number" id="img-pos-y-num" class="num-input-1to10" min="1" max="10" value="5" />
          </div>
        </div>
        <div class="row">
          <label>拡大・縮小</label>
          <div class="control-inputs">
            <input type="range" id="img-scale" min="0.2" max="2.5" step="0.02" value="1" />
            <input type="number" id="img-scale-num" class="num-input-1to10" min="1" max="10" value="4" />
          </div>
        </div>
        <div class="row">
          <label>回転</label>
          <div class="control-inputs">
            <input type="range" id="img-rotate" min="-180" max="180" value="0" />
            <input type="number" id="img-rotate-num" class="num-input-1to10" min="1" max="10" value="5" />
          </div>
        </div>
      </div>

      <!-- 5. 特殊エフェクト（10種＋対象選択） -->
      <div class="control-group">
        <h2>5. 特殊エフェクト（加工・ノイズ）</h2>
        <div class="row">
          <label>エフェクト種類</label>
          <select id="fx-type" style="flex: 1.5;">
            <option value="none">なし</option>
            <option value="rgbSplit">1. RGBズレ（色収差）</option>
            <option value="glitch">2. グリッチ（スライス乱れ）</option>
            <option value="scanlines">3. スキャンライン（走査線）</option>
            <option value="noise">4. フィルムノイズ（砂嵐）</option>
            <option value="neonGlow">5. ネオン発光（ブルーム）</option>
            <option value="pixelate">6. ドット絵風（ピクセル化）</option>
            <option value="vignette">7. ビネット（周辺減光）</option>
            <option value="monochrome">8. モノクロ・高コントラスト</option>
            <option value="sepia">9. セピア・レトロ</option>
            <option value="hueRotate">10. 色相シフト（サイケデリック）</option>
          </select>
        </div>
        <div class="row">
          <label>適用対象</label>
          <select id="fx-target" style="flex: 1.5;">
            <option value="all">全体（フレーム＋画像）</option>
            <option value="frame">フレーム・背景のみ</option>
            <option value="character">キャラクター画像のみ</option>
          </select>
        </div>
        <div class="row">
          <label>エフェクト強度</label>
          <div class="control-inputs">
            <input type="range" id="fx-intensity" min="1" max="10" step="1" value="5" />
            <input type="number" id="fx-intensity-num" class="num-input-1to10" min="1" max="10" value="5" />
          </div>
        </div>
      </div>

      <!-- 6. 書き出し -->
      <div class="control-group">
        <h2>6. 書き出し（透過PNG）</h2>
        <div class="row">
          <label>出力サイズ (px)</label>
          <input type="number" id="export-size" value="1000" min="128" max="4096" step="1" style="width: 100px;" />
        </div>
        <button id="export-btn" class="btn">PNG画像をダウンロード</button>
      </div>
    </div>
  </div>

  <script>
    const dropScreen = document.getElementById('drop-screen');
    const editorScreen = document.getElementById('editor-screen');
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const resetBtn = document.getElementById('reset-btn');
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');

    let userImg = null;
    let imgState = { x: 400, y: 420, scale: 1, rotate: 0 };
    let isDraggingImg = false;
    let dragStart = { x: 0, y: 0 };

    let popoutAngle = -Math.PI / 2;
    let isDraggingDial = false;

    const els = {
      shapeType: document.getElementById('shape-type'),
      polygonSidesRow: document.getElementById('polygon-sides-row'),
      polygonSides: document.getElementById('polygon-sides'),
      polygonSidesNum: document.getElementById('polygon-sides-num'),
      cornerRadiusRow: document.getElementById('corner-radius-row'),
      cornerRadius: document.getElementById('corner-radius'),
      cornerRadiusNum: document.getElementById('corner-radius-num'),
      aspectX: document.getElementById('aspect-x'),
      aspectXNum: document.getElementById('aspect-x-num'),
      aspectY: document.getElementById('aspect-y'),
      aspectYNum: document.getElementById('aspect-y-num'),
      popoutEnable: document.getElementById('popout-enable'),
      popoutControls: document.getElementById('popout-controls'),
      angleDial: document.getElementById('angle-dial'),
      angleKnob: document.getElementById('angle-knob'),
      popoutSpread: document.getElementById('popout-spread'),
      popoutSpreadNum: document.getElementById('popout-spread-num'),
      borderWidth: document.getElementById('border-width'),
      borderWidthNum: document.getElementById('border-width-num'),
      borderColor: document.getElementById('border-color'),
      borderHex: document.getElementById('border-hex'),
      bgPreset: document.getElementById('bg-preset'),
      bgColor1Row: document.getElementById('bg-color1-row'),
      bgColor1: document.getElementById('bg-color1'),
      bgHex1: document.getElementById('bg-hex1'),
      bgColor2Row: document.getElementById('bg-color2-row'),
      bgColor2: document.getElementById('bg-color2'),
      bgHex2: document.getElementById('bg-hex2'),
      imgPosX: document.getElementById('img-pos-x'),
      imgPosXNum: document.getElementById('img-pos-x-num'),
      imgPosY: document.getElementById('img-pos-y'),
      imgPosYNum: document.getElementById('img-pos-y-num'),
      imgScale: document.getElementById('img-scale'),
      imgScaleNum: document.getElementById('img-scale-num'),
      imgRotate: document.getElementById('img-rotate'),
      imgRotateNum: document.getElementById('img-rotate-num'),
      fxType: document.getElementById('fx-type'),
      fxTarget: document.getElementById('fx-target'),
      fxIntensity: document.getElementById('fx-intensity'),
      fxIntensityNum: document.getElementById('fx-intensity-num'),
      exportSize: document.getElementById('export-size'),
      exportBtn: document.getElementById('export-btn')
    };

    function bindSync(rangeEl, numEl, minVal, maxVal, isFloat = false, callback = null) {
      rangeEl.addEventListener('input', () => {
        const v = parseFloat(rangeEl.value);
        const mapped = Math.round(1 + ((v - minVal) / (maxVal - minVal)) * 9);
        numEl.value = Math.max(1, Math.min(10, mapped));
        if (callback) callback(v);
        render();
      });

      numEl.addEventListener('input', () => {
        let n = parseInt(numEl.value, 10);
        if (isNaN(n)) return;
        n = Math.max(1, Math.min(10, n));
        const v = minVal + ((n - 1) / 9) * (maxVal - minVal);
        rangeEl.value = isFloat ? v.toFixed(2) : Math.round(v);
        if (callback) callback(parseFloat(rangeEl.value));
        render();
      });
    }

    bindSync(els.aspectX, els.aspectXNum, 0.5, 1.4, true);
    bindSync(els.aspectY, els.aspectYNum, 0.5, 1.4, true);
    bindSync(els.polygonSides, els.polygonSidesNum, 3, 12, false);
    bindSync(els.cornerRadius, els.cornerRadiusNum, 0, 200, false);
    bindSync(els.popoutSpread, els.popoutSpreadNum, 30, 180, false);
    bindSync(els.borderWidth, els.borderWidthNum, 0, 40, false);
    bindSync(els.fxIntensity, els.fxIntensityNum, 1, 10, false);
    
    bindSync(els.imgPosX, els.imgPosXNum, 0, 800, false, (val) => { imgState.x = val; });
    bindSync(els.imgPosY, els.imgPosYNum, 0, 800, false, (val) => { imgState.y = val; });
    bindSync(els.imgScale, els.imgScaleNum, 0.2, 2.5, true, (val) => { imgState.scale = val; });
    bindSync(els.imgRotate, els.imgRotateNum, -180, 180, false, (val) => { imgState.rotate = val; });

    els.fxType.addEventListener('change', render);
    els.fxTarget.addEventListener('change', render);

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          userImg = img;
          const baseScale = 520 / Math.max(img.width, img.height);
          imgState = { x: 400, y: 420, scale: baseScale, rotate: 0 };
          
          els.imgPosX.value = 400; els.imgPosXNum.value = 5;
          els.imgPosY.value = 420; els.imgPosYNum.value = 5;

          els.imgScale.value = baseScale.toFixed(2);
          const scaleNum = Math.round(1 + ((baseScale - 0.2) / (2.5 - 0.2)) * 9);
          els.imgScaleNum.value = Math.max(1, Math.min(10, scaleNum));
          
          els.imgRotate.value = 0;
          els.imgRotateNum.value = 5;

          dropScreen.classList.add('hidden');
          editorScreen.style.display = 'flex';
          resetBtn.classList.remove('hidden');
          updateDialKnob();
          render();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFile(e.dataTransfer.files[0]);
    });

    resetBtn.addEventListener('click', () => {
      editorScreen.style.display = 'none';
      dropScreen.classList.remove('hidden');
      resetBtn.classList.add('hidden');
      fileInput.value = '';
    });

    els.shapeType.addEventListener('change', () => {
      const val = els.shapeType.value;
      els.polygonSidesRow.classList.toggle('hidden', val !== 'polygon');
      els.cornerRadiusRow.classList.toggle('hidden', val !== 'roundRect');
      render();
    });

    els.bgPreset.addEventListener('change', () => {
      const val = els.bgPreset.value;
      els.bgColor1Row.classList.toggle('hidden', val === 'transparent');
      els.bgColor2Row.classList.toggle('hidden', val !== 'gradient' && val !== 'sunburst');
      render();
    });

    function syncColor(picker, hexInput) {
      picker.addEventListener('input', () => {
        hexInput.value = picker.value.toUpperCase();
        render();
      });
      hexInput.addEventListener('input', () => {
        let v = hexInput.value.trim();
        if (!v.startsWith('#')) v = '#' + v;
        if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
          picker.value = v;
          render();
        }
      });
    }
    syncColor(els.borderColor, els.borderHex);
    syncColor(els.bgColor1, els.bgHex1);
    syncColor(els.bgColor2, els.bgHex2);

    function updateDialFromEvent(e) {
      const rect = els.angleDial.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      popoutAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
      updateDialKnob();
      render();
    }

    function updateDialKnob() {
      const r = 24;
      const kx = 30 + Math.cos(popoutAngle) * r;
      const ky = 30 + Math.sin(popoutAngle) * r;
      els.angleKnob.style.left = `${kx}px`;
      els.angleKnob.style.top = `${ky}px`;
    }

    els.angleDial.addEventListener('mousedown', (e) => {
      isDraggingDial = true;
      updateDialFromEvent(e);
    });
    window.addEventListener('mousemove', (e) => {
      if (isDraggingDial) updateDialFromEvent(e);
    });
    window.addEventListener('mouseup', () => {
      isDraggingDial = false;
    });

    els.popoutEnable.addEventListener('change', () => {
      els.popoutControls.style.opacity = els.popoutEnable.checked ? '1' : '0.4';
      els.popoutControls.style.pointerEvents = els.popoutEnable.checked ? 'auto' : 'none';
      render();
    });

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleRatio = canvas.width / rect.width;
      isDraggingImg = true;
      dragStart.x = (e.clientX - rect.left) * scaleRatio - imgState.x;
      dragStart.y = (e.clientY - rect.top) * scaleRatio - imgState.y;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDraggingImg) return;
      const rect = canvas.getBoundingClientRect();
      const scaleRatio = canvas.width / rect.width;
      imgState.x = (e.clientX - rect.left) * scaleRatio - dragStart.x;
      imgState.y = (e.clientY - rect.top) * scaleRatio - dragStart.y;
      
      els.imgPosX.value = Math.max(0, Math.min(800, imgState.x));
      const xNum = Math.round(1 + ((imgState.x - 0) / (800 - 0)) * 9);
      els.imgPosXNum.value = Math.max(1, Math.min(10, xNum));

      els.imgPosY.value = Math.max(0, Math.min(800, imgState.y));
      const yNum = Math.round(1 + ((imgState.y - 0) / (800 - 0)) * 9);
      els.imgPosYNum.value = Math.max(1, Math.min(10, yNum));

      render();
    });

    window.addEventListener('mouseup', () => {
      isDraggingImg = false;
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.04 : -0.04;
      imgState.scale = Math.min(2.5, Math.max(0.2, imgState.scale + delta));
      els.imgScale.value = imgState.scale.toFixed(2);
      const scaleNum = Math.round(1 + ((imgState.scale - 0.2) / (2.5 - 0.2)) * 9);
      els.imgScaleNum.value = Math.max(1, Math.min(10, scaleNum));
      render();
    }, { passive: false });

    function createFramePath(targetCtx, cx, cy, rx, ry) {
      const shape = els.shapeType.value;
      targetCtx.beginPath();

      if (shape === 'circle') {
        targetCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      } else if (shape === 'rect') {
        targetCtx.rect(cx - rx, cy - ry, rx * 2, ry * 2);
      } else if (shape === 'roundRect') {
        const r = Math.min(parseFloat(els.cornerRadius.value), rx, ry);
        targetCtx.roundRect(cx - rx, cy - ry, rx * 2, ry * 2, r);
      } else if (shape === 'polygon') {
        const sides = parseInt(els.polygonSides.value, 10);
        const offsetAngle = -Math.PI / 2;
        for (let i = 0; i < sides; i++) {
          const a = offsetAngle + (i * 2 * Math.PI) / sides;
          const px = cx + Math.cos(a) * rx;
          const py = cy + Math.sin(a) * ry;
          if (i === 0) targetCtx.moveTo(px, py);
          else targetCtx.lineTo(px, py);
        }
        targetCtx.closePath();
      } else if (shape === 'star') {
        const spikes = 5;
        const innerRatio = 0.48;
        const offsetAngle = -Math.PI / 2;
        for (let i = 0; i < spikes * 2; i++) {
          const rMult = i % 2 === 0 ? 1 : innerRatio;
          const a = offsetAngle + (i * Math.PI) / spikes;
          const px = cx + Math.cos(a) * rx * rMult;
          const py = cy + Math.sin(a) * ry * rMult;
          if (i === 0) targetCtx.moveTo(px, py);
          else targetCtx.lineTo(px, py);
        }
        targetCtx.closePath();
      } else if (shape === 'heart') {
        const topY = cy - ry * 0.4;
        targetCtx.moveTo(cx, cy + ry);
        targetCtx.bezierCurveTo(cx - rx * 1.4, cy + ry * 0.2, cx - rx * 0.8, cy - ry * 1.1, cx, topY);
        targetCtx.bezierCurveTo(cx + rx * 0.8, cy - ry * 1.1, cx + rx * 1.4, cy + ry * 0.2, cx, cy + ry);
        targetCtx.closePath();
      } else if (shape === 'sfHud') {
        const cut = Math.min(rx, ry) * 0.24;
        const left = cx - rx;
        const right = cx + rx;
        const top = cy - ry;
        const bottom = cy + ry;

        targetCtx.moveTo(left + cut * 1.3, top);
        targetCtx.lineTo(right - cut * 1.6, top);
        targetCtx.lineTo(right, top + cut * 1.6);
        targetCtx.lineTo(right, bottom - cut * 0.8);
        targetCtx.lineTo(right - cut * 0.8, bottom);
        targetCtx.lineTo(left + cut * 0.8, bottom);
        targetCtx.lineTo(left, bottom - cut * 0.8);
        targetCtx.lineTo(left, top + cut * 1.3);
        targetCtx.closePath();
      }
    }

    function drawSfHudOverlay(targetCtx, cx, cy, rx, ry, borderW, color) {
      if (borderW <= 0) return;
      targetCtx.save();

      const cut = Math.min(rx, ry) * 0.24;
      const left = cx - rx;
      const right = cx + rx;
      const top = cy - ry;
      const bottom = cy + ry;
      const baseLine = Math.max(2, borderW * 0.35);

      targetCtx.shadowColor = color;
      targetCtx.shadowBlur = 18;
      targetCtx.strokeStyle = color;
      targetCtx.fillStyle = color;

      targetCtx.lineWidth = baseLine;
      createFramePath(targetCtx, cx, cy, rx, ry);
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.moveTo(left - 6, top - 6);
      targetCtx.lineTo(left + cut * 1.05, top - 6);
      targetCtx.lineTo(left - 6, top + cut * 1.05);
      targetCtx.closePath();
      targetCtx.fill();

      const armorW = Math.max(8, borderW * 0.9);
      targetCtx.beginPath();
      targetCtx.moveTo(right - cut * 1.6, top - armorW * 0.5);
      targetCtx.lineTo(right + armorW * 0.5, top + cut * 1.6);
      targetCtx.lineTo(right + armorW * 0.5, bottom - cut * 0.8);
      targetCtx.lineTo(right - cut * 0.8, bottom + armorW * 0.5);
      targetCtx.lineTo(right - cut * 1.1, bottom);
      targetCtx.lineTo(right - armorW * 0.3, bottom - cut * 0.8);
      targetCtx.lineTo(right - armorW * 0.3, top + cut * 1.7);
      targetCtx.lineTo(right - cut * 1.7, top + armorW * 0.3);
      targetCtx.closePath();
      targetCtx.fill();

      const barCount = 6;
      const barW = (rx * 0.45) / barCount;
      const barH = Math.max(6, borderW * 0.65);
      for (let i = 0; i < barCount; i++) {
        const bx = left + cut * 1.5 + i * (barW + 6);
        const by = top + 6;
        targetCtx.globalAlpha = i < 4 ? 0.95 : 0.35;
        targetCtx.beginPath();
        targetCtx.moveTo(bx + 6, by);
        targetCtx.lineTo(bx + barW + 6, by);
        targetCtx.lineTo(bx + barW, by + barH);
        targetCtx.lineTo(bx, by + barH);
        targetCtx.closePath();
        targetCtx.fill();
      }
      targetCtx.globalAlpha = 1.0;

      const bBarCount = 5;
      const bBarW = (rx * 0.5) / bBarCount;
      for (let i = 0; i < bBarCount; i++) {
        const bx = cx - rx * 0.1 + i * (bBarW + 8);
        const by = bottom - barH - 4;
        targetCtx.globalAlpha = i < 3 ? 0.95 : 0.3;
        targetCtx.beginPath();
        targetCtx.moveTo(bx + 8, by);
        targetCtx.lineTo(bx + bBarW + 8, by);
        targetCtx.lineTo(bx + bBarW, by + barH);
        targetCtx.lineTo(bx, by + barH);
        targetCtx.closePath();
        targetCtx.fill();
      }
      targetCtx.globalAlpha = 1.0;

      const sideBarW = Math.max(6, borderW * 0.6);
      targetCtx.beginPath();
      targetCtx.moveTo(left - sideBarW * 0.5, top + ry * 0.45);
      targetCtx.lineTo(left + sideBarW * 0.5, top + ry * 0.55);
      targetCtx.lineTo(left + sideBarW * 0.5, bottom - ry * 0.45);
      targetCtx.lineTo(left - sideBarW * 0.5, bottom - ry * 0.35);
      targetCtx.closePath();
      targetCtx.fill();

      targetCtx.lineWidth = Math.max(1.5, baseLine * 0.7);
      targetCtx.beginPath();
      targetCtx.moveTo(left - 4, bottom - cut * 0.55);
      targetCtx.lineTo(left + cut * 0.55, bottom + 4);
      targetCtx.lineTo(left - 4, bottom + 4);
      targetCtx.closePath();
      targetCtx.stroke();

      targetCtx.restore();
    }

    // エフェクト適用関数（オフスクリーンCanvasを受け取り加工して返す）
    function applyEffectToLayer(sourceCanvas, fxType, intensity) {
      if (fxType === 'none') return sourceCanvas;

      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = w;
      outCanvas.height = h;
      const outCtx = outCanvas.getContext('2d');
      const factor = intensity / 10; // 0.1 ~ 1.0

      if (fxType === 'rgbSplit') {
        // RGB色収差
        const shift = Math.round(intensity * 2.8);
        outCtx.drawImage(sourceCanvas, 0, 0);
        
        const tempR = document.createElement('canvas');
        tempR.width = w; tempR.height = h;
        const rCtx = tempR.getContext('2d');
        rCtx.drawImage(sourceCanvas, -shift, 0);
        rCtx.globalCompositeOperation = 'source-in';
        rCtx.fillStyle = 'rgba(255, 0, 80, 0.75)';
        rCtx.fillRect(0, 0, w, h);

        const tempB = document.createElement('canvas');
        tempB.width = w; tempB.height = h;
        const bCtx = tempB.getContext('2d');
        bCtx.drawImage(sourceCanvas, shift, 0);
        bCtx.globalCompositeOperation = 'source-in';
        bCtx.fillStyle = 'rgba(0, 220, 255, 0.75)';
        bCtx.fillRect(0, 0, w, h);

        outCtx.globalCompositeOperation = 'screen';
        outCtx.drawImage(tempR, 0, 0);
        outCtx.drawImage(tempB, 0, 0);
        outCtx.globalCompositeOperation = 'source-over';

      } else if (fxType === 'glitch') {
        // スライスグリッチ
        outCtx.drawImage(sourceCanvas, 0, 0);
        const slices = 6 + intensity * 2;
        const maxOffset = intensity * 6;
        for (let i = 0; i < slices; i++) {
          const sy = Math.floor(Math.random() * h);
          const sh = Math.floor(4 + Math.random() * (14 + intensity * 2));
          const dx = Math.floor((Math.random() - 0.5) * 2 * maxOffset);
          outCtx.clearRect(0, sy, w, sh);
          outCtx.drawImage(sourceCanvas, 0, sy, w, sh, dx, sy, w, sh);
        }

      } else if (fxType === 'scanlines') {
        // スキャンライン（走査線）
        outCtx.drawImage(sourceCanvas, 0, 0);
        outCtx.globalCompositeOperation = 'source-atop';
        outCtx.fillStyle = `rgba(0, 0, 0, ${0.15 + factor * 0.45})`;
        const gap = Math.max(4, 12 - Math.floor(intensity * 0.6));
        for (let y = 0; y < h; y += gap) {
          outCtx.fillRect(0, y, w, Math.max(2, gap / 2));
        }

      } else if (fxType === 'noise') {
        // フィルムノイズ（砂嵐）
        outCtx.drawImage(sourceCanvas, 0, 0);
        const imgData = outCtx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const amount = intensity * 12;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 3] > 0) {
            const rand = (Math.random() - 0.5) * amount * 2;
            data[i] = Math.min(255, Math.max(0, data[i] + rand));
            data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + rand));
            data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + rand));
          }
        }
        outCtx.putImageData(imgData, 0, 0);

      } else if (fxType === 'neonGlow') {
        // ネオン発光（ブルーム）
        outCtx.save();
        outCtx.filter = `blur(${intensity * 2.5}px) brightness(1.4)`;
        outCtx.drawImage(sourceCanvas, 0, 0);
        outCtx.restore();
        outCtx.globalCompositeOperation = 'screen';
        outCtx.drawImage(sourceCanvas, 0, 0);

      } else if (fxType === 'pixelate') {
        // ドット絵風（ピクセル化）
        const pixelSize = Math.max(3, intensity * 2.5);
        const smallW = Math.max(1, Math.floor(w / pixelSize));
        const smallH = Math.max(1, Math.floor(h / pixelSize));
        const tempC = document.createElement('canvas');
        tempC.width = smallW; tempC.height = smallH;
        const tempCtx = tempC.getContext('2d');
        tempCtx.drawImage(sourceCanvas, 0, 0, smallW, smallH);

        outCtx.imageSmoothingEnabled = false;
        outCtx.drawImage(tempC, 0, 0, smallW, smallH, 0, 0, w, h);

      } else if (fxType === 'vignette') {
        // ビネット（周辺減光）
        outCtx.drawImage(sourceCanvas, 0, 0);
        outCtx.globalCompositeOperation = 'source-atop';
        const grad = outCtx.createRadialGradient(w / 2, h / 2, w * 0.15, w / 2, h / 2, w * 0.48);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, `rgba(0,0,0,${0.25 + factor * 0.65})`);
        outCtx.fillStyle = grad;
        outCtx.fillRect(0, 0, w, h);

      } else if (fxType === 'monochrome') {
        // モノクロ・高コントラスト
        outCtx.filter = `grayscale(100%) contrast(${100 + intensity * 12}%)`;
        outCtx.drawImage(sourceCanvas, 0, 0);

      } else if (fxType === 'sepia') {
        // セピア・レトロ
        outCtx.filter = `sepia(${40 + intensity * 6}%) contrast(${95 + intensity * 3}%)`;
        outCtx.drawImage(sourceCanvas, 0, 0);

      } else if (fxType === 'hueRotate') {
        // 色相シフト
        outCtx.filter = `hue-rotate(${intensity * 36}deg) saturate(${110 + intensity * 8}%)`;
        outCtx.drawImage(sourceCanvas, 0, 0);
      }

      return outCanvas;
    }

    function drawScene(targetCtx, size, isExport = false) {
      const scaleFactor = size / 800;
      const fxType = els.fxType.value;
      const fxTarget = els.fxTarget.value;
      const fxIntensity = parseInt(els.fxIntensity.value, 10);

      const cx = 400;
      const cy = 400;
      const baseR = 270;
      const rx = baseR * parseFloat(els.aspectX.value);
      const ry = baseR * parseFloat(els.aspectY.value);
      const borderW = parseFloat(els.borderWidth.value);
      const shape = els.shapeType.value;

      // レイヤー1：フレーム＆背景用オフスクリーンCanvas
      let frameCanvas = document.createElement('canvas');
      frameCanvas.width = 800;
      frameCanvas.height = 800;
      let fCtx = frameCanvas.getContext('2d');

      fCtx.save();
      createFramePath(fCtx, cx, cy, rx, ry);
      fCtx.clip();

      const bgType = els.bgPreset.value;
      if (bgType === 'solid') {
        fCtx.fillStyle = els.bgColor1.value;
        fCtx.fillRect(0, 0, 800, 800);
      } else if (bgType === 'gradient') {
        const grad = fCtx.createLinearGradient(cx - rx, cy - ry, cx + rx, cy + ry);
        grad.addColorStop(0, els.bgColor1.value);
        grad.addColorStop(1, els.bgColor2.value);
        fCtx.fillStyle = grad;
        fCtx.fillRect(0, 0, 800, 800);
      } else if (bgType === 'sunburst') {
        fCtx.fillStyle = els.bgColor1.value;
        fCtx.fillRect(0, 0, 800, 800);
        fCtx.fillStyle = els.bgColor2.value;
        const rays = 24;
        for (let i = 0; i < rays; i += 2) {
          fCtx.beginPath();
          fCtx.moveTo(cx, cy);
          fCtx.arc(cx, cy, 500, (i * 2 * Math.PI) / rays, ((i + 1) * 2 * Math.PI) / rays);
          fCtx.closePath();
          fCtx.fill();
        }
      }
      fCtx.restore();

      // レイヤー2：キャラクター用オフスクリーンCanvas
      let charCanvas = document.createElement('canvas');
      charCanvas.width = 800;
      charCanvas.height = 800;
      let cCtx = charCanvas.getContext('2d');

      if (userImg) {
        drawCharacter(cCtx);
      }

      // レイヤー3：枠線（ボーダー）用オフスクリーンCanvas
      let borderCanvas = document.createElement('canvas');
      borderCanvas.width = 800;
      borderCanvas.height = 800;
      let bCtx = borderCanvas.getContext('2d');

      if (shape === 'sfHud') {
        drawSfHudOverlay(bCtx, cx, cy, rx, ry, borderW, els.borderColor.value);
      } else if (borderW > 0) {
        bCtx.save();
        createFramePath(bCtx, cx, cy, rx, ry);
        bCtx.lineWidth = borderW;
        bCtx.strokeStyle = els.borderColor.value;
        bCtx.stroke();
        bCtx.restore();
      }

      // 対象別エフェクトの事前適用
      if (fxType !== 'none') {
        if (fxTarget === 'frame') {
          frameCanvas = applyEffectToLayer(frameCanvas, fxType, fxIntensity);
          borderCanvas = applyEffectToLayer(borderCanvas, fxType, fxIntensity);
        } else if (fxTarget === 'character') {
          charCanvas = applyEffectToLayer(charCanvas, fxType, fxIntensity);
        }
      }

      // 合成用ベースCanvas（800x800）
      let compCanvas = document.createElement('canvas');
      compCanvas.width = 800;
      compCanvas.height = 800;
      let compCtx = compCanvas.getContext('2d');

      // 1. 背景描画
      compCtx.drawImage(frameCanvas, 0, 0);

      // 2. フレーム内キャラクター描画
      compCtx.save();
      createFramePath(compCtx, cx, cy, rx, ry);
      compCtx.clip();
      compCtx.drawImage(charCanvas, 0, 0);
      compCtx.restore();

      // 3. フレーム枠線描画
      compCtx.drawImage(borderCanvas, 0, 0);

      // 4. はみ出し演出描画
      if (userImg && els.popoutEnable.checked) {
        compCtx.save();
        const spreadRad = (parseFloat(els.popoutSpread.value) * Math.PI) / 180;
        compCtx.beginPath();
        compCtx.moveTo(cx, cy);
        compCtx.arc(cx, cy, 800, popoutAngle - spreadRad / 2, popoutAngle + spreadRad / 2);
        compCtx.closePath();
        compCtx.clip();
        compCtx.drawImage(charCanvas, 0, 0);
        compCtx.restore();
      }

      // 「全体」にエフェクトをかける場合は合成後に適用
      if (fxType !== 'none' && fxTarget === 'all') {
        compCanvas = applyEffectToLayer(compCanvas, fxType, fxIntensity);
      }

      // 最終出力Canvasへスケーリング描画
      targetCtx.save();
      targetCtx.clearRect(0, 0, size, size);
      targetCtx.scale(scaleFactor, scaleFactor);
      targetCtx.drawImage(compCanvas, 0, 0);

      // プレビュー画面でのみ「はみ出し方向」のガイド点線を描画
      if (!isExport && userImg && els.popoutEnable.checked) {
        const spreadRad = (parseFloat(els.popoutSpread.value) * Math.PI) / 180;
        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.moveTo(cx, cy);
        targetCtx.arc(cx, cy, 380, popoutAngle - spreadRad / 2, popoutAngle + spreadRad / 2);
        targetCtx.closePath();
        targetCtx.strokeStyle = 'rgba(239, 68, 68, 0.7)';
        targetCtx.lineWidth = 3;
        targetCtx.setLineDash([8, 6]);
        targetCtx.stroke();
        targetCtx.restore();
      }

      targetCtx.restore();
    }

    function drawCharacter(targetCtx) {
      targetCtx.save();
      targetCtx.translate(imgState.x, imgState.y);
      targetCtx.rotate((imgState.rotate * Math.PI) / 180);
      targetCtx.scale(imgState.scale, imgState.scale);
      targetCtx.drawImage(userImg, -userImg.width / 2, -userImg.height / 2);
      targetCtx.restore();
    }

    function render() {
      drawScene(ctx, 800, false);
    }

    els.exportBtn.addEventListener('click', () => {
      if (!userImg) return;
      const outSize = Math.min(4096, Math.max(128, parseInt(els.exportSize.value, 10) || 1000));
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = outSize;
      exportCanvas.height = outSize;
      const exportCtx = exportCanvas.getContext('2d');

      drawScene(exportCtx, outSize, true);

      const link = document.createElement('a');
      link.download = `icon_${outSize}px.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
